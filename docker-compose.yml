services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nexacore_cotizador}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      # `healthcheck.sh` viene en la imagen oficial de MariaDB y es la forma
      # documentada de sondearla. Sustituye a `mysqladmin`, cuyo nombre quedó
      # obsoleto en MariaDB 11 (ahora es `mariadb-admin`), y además comprueba
      # que InnoDB terminó de inicializar, no solo que el socket responde.
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      # En el primer despliegue el volumen está vacío y MariaDB tiene que crear
      # las tablas del sistema. Sin `start_period`, Docker cuenta esos fallos
      # como reales y marca el contenedor unhealthy antes de que termine.
      start_period: 90s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD:-password}@db:3306/${MYSQL_DATABASE:-nexacore_cotizador}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-change-me-in-production}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      ADMIN_NAME: ${ADMIN_NAME:-Admin NexaCore}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL es obligatorio}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD es obligatorio}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
