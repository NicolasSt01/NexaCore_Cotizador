services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      # Obligatoria a propósito. Con un valor por defecto, un despliegue sin la
      # variable inicializa el volumen con esa contraseña; al definirla después
      # MariaDB la ignora (solo se aplica al volumen vacío) y todo queda con un
      # "Access denied" difícil de rastrear.
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD es obligatoria}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nexacore_cotizador}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      # `healthcheck.sh` viene en la imagen oficial de MariaDB y es la forma
      # documentada de sondearla. Sustituye a `mysqladmin`, cuyo nombre quedó
      # obsoleto en MariaDB 11 (ahora es `mariadb-admin`), y además comprueba
      # que InnoDB terminó de inicializar, no solo que el socket responde.
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      # En el primer despliegue el volumen está vacío y MariaDB tiene que crear
      # las tablas del sistema. Sin `start_period`, Docker cuenta esos fallos
      # como reales y marca el contenedor unhealthy antes de que termine.
      start_period: 90s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      # Puerto del HOST configurable: en un Dokploy con varios servicios, fijar
      # el 3000 choca con el primero que ya lo tomó. Dentro del contenedor la
      # app siempre escucha en 3000. Si enrutas por dominio con Traefik, puedes
      # borrar este bloque entero: Traefik llega por la red interna de Docker.
      - "${APP_PORT:-3033}:3000"
    environment:
      # Sin valor por defecto en la contraseña: si difiriera del que usó `db` al
      # inicializar el volumen, la app fallaría con "Access denied".
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD es obligatoria}@db:3306/${MYSQL_DATABASE:-nexacore_cotizador}
      # Firma los tokens de sesión. Sin valor por defecto a propósito: uno
      # conocido permitiría falsificar una sesión de administrador.
      # Genérala con `openssl rand -base64 32`.
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET:?NEXTAUTH_SECRET es obligatoria}"
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      ADMIN_NAME: ${ADMIN_NAME:-Admin NexaCore}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL es obligatorio}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD es obligatorio}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      # `default` es la red del proyecto, por donde la app llega a `db`.
      # Al declarar `networks` hay que listarla explícitamente o se pierde.
      - default
      # Traefik corre en `dokploy-network`. Sin unir la app a esa red, Traefik
      # tiene la ruta del dominio pero no alcanza el contenedor: eso es el 502.
      - dokploy-network

volumes:
  db_data:

networks:
  # La crea Dokploy al instalarse; aquí solo se referencia.
  dokploy-network:
    external: true
